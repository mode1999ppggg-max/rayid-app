
name: Build APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Create Android Structure
        run: flutter create --template=app --platforms=android --org com.rayid --project-name rayid_app .

      - name: Configure Image Cropper Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml was not generated.")

          text = manifest.read_text()
          activity = '''
                  <activity
                      android:name="com.yalantis.ucrop.UCropActivity"
                      android:screenOrientation="portrait"
                      android:theme="@style/Ucrop.CropTheme"
                      android:exported="false" />
          '''

          if "com.yalantis.ucrop.UCropActivity" not in text:
              if "</application>" not in text:
                  raise SystemExit("Could not find application tag.")
              text = text.replace("</application>", activity + "\n    </application>")
              manifest.write_text(text)

          values = Path("android/app/src/main/res/values")
          values.mkdir(parents=True, exist_ok=True)
          styles = values / "styles.xml"

          if styles.exists():
              content = styles.read_text()
              if 'name="Ucrop.CropTheme"' not in content:
                  content = content.replace(
                      "</resources>",
                      '    <style name="Ucrop.CropTheme" parent="Theme.AppCompat.Light.NoActionBar"/>\n</resources>'
                  )
                  styles.write_text(content)
          else:
              styles.write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<resources>\n'
                  '    <style name="Ucrop.CropTheme" parent="Theme.AppCompat.Light.NoActionBar"/>\n'
                  '</resources>\n'
              )

          values35 = Path("android/app/src/main/res/values-v35")
          values35.mkdir(parents=True, exist_ok=True)
          (values35 / "styles.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <style name="Ucrop.CropTheme" parent="Theme.AppCompat.Light.NoActionBar">\n'
              '        <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>\n'
              '    </style>\n'
              '</resources>\n'
          )

          print("Image cropper Android configuration completed.")
          PY

      - name: Configure Firebase Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          settings = Path("android/settings.gradle.kts")
          app_gradle = Path("android/app/build.gradle.kts")
          firebase_config = Path("android/app/google-services.json")

          if not settings.exists() or not app_gradle.exists():
              raise SystemExit("Android Kotlin Gradle files were not generated.")

          if not firebase_config.exists():
              raise SystemExit("Firebase google-services.json is missing.")

          config = json.loads(firebase_config.read_text())
          packages = [
              client["client_info"]["android_client_info"]["package_name"]
              for client in config.get("client", [])
          ]

          if "com.rayid.app" not in packages:
              raise SystemExit("Firebase package name does not match com.rayid.app.")

          text = settings.read_text()
          plugin_line = '    id("com.google.gms.google-services") version "4.4.2" apply false'

          if "com.google.gms.google-services" not in text:
              if "plugins {" not in text:
                  raise SystemExit("Could not find plugins block in settings.gradle.kts.")
              text = text.replace("plugins {", "plugins {\n" + plugin_line, 1)
              settings.write_text(text)

          text = app_gradle.read_text()
          app_plugin = '    id("com.google.gms.google-services")'

          if "com.google.gms.google-services" not in text:
              if "plugins {" not in text:
                  raise SystemExit("Could not find plugins block in app Gradle file.")
              text = text.replace("plugins {", "plugins {\n" + app_plugin, 1)

          text = re.sub(
              r'namespace\s*=\s*"[^"]+"',
              'namespace = "com.rayid.app"',
              text,
              count=1
          )

          text = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.rayid.app"',
              text,
              count=1
          )

          app_gradle.write_text(text)

          kotlin_old = Path("android/app/src/main/kotlin/com/rayid/rayid_app/MainActivity.kt")
          kotlin_new = Path("android/app/src/main/kotlin/com/rayid/app/MainActivity.kt")

          if kotlin_old.exists():
              kotlin_new.parent.mkdir(parents=True, exist_ok=True)
              kotlin_text = kotlin_old.read_text()
              kotlin_text = kotlin_text.replace(
                  "package com.rayid.rayid_app",
                  "package com.rayid.app"
              )
              kotlin_new.write_text(kotlin_text)
              kotlin_old.unlink()

          print("Firebase and Android package configuration completed.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Firebase Android Configuration
        run: |
          cd android
          echo "Checking Google Services Gradle plugin..."
          ./gradlew :app:tasks --all | grep -i "googleServices" || true
          cd ..

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rayid-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
