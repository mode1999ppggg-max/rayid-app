name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create fresh Android project structure
        run: |
          mkdir /tmp/rayid
          cp -r lib assets pubspec.yaml /tmp/rayid/ 2>/dev/null || true
          flutter create --platforms=android .
          cp -r /tmp/rayid/lib .
          cp -r /tmp/rayid/assets . 2>/dev/null || true
          cp /tmp/rayid/pubspec.yaml .
          
      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rayid-apk
          path: build/app/outputs/flutter-apk/app-release.apk
